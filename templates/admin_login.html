
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador | La L@gunita</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="admin-login-page">
  <main class="login-card">
    <div class="admin-mark">A</div>
    <h1>Panel de administración</h1>
    <p>Acceso exclusivo para consultar los resultados de la encuesta.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="login-error">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <label>Usuario
        <input type="text" name="username" required autocomplete="username">
      </label>
      <label>Contraseña
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button class="primary-btn full" type="submit">Iniciar sesión</button>
    </form>
    <a class="back-link" href="{{ url_for('index') }}">← Volver a la encuesta</a>
  </main>
</body>
</html>
